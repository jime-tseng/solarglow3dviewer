<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MiDES 3D Viewer</title>
    
    <script src="https://cdn.jsdelivr.net/npm/meshoptimizer@0.21.0/meshopt_decoder.js"></script>

    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
</head>
<body style="margin: 0; background-color: #f5f5f5;">

    <model-viewer 
        src="SOLAR_GLOW.glb" 
        ar 
        ar-modes="webxr scene-viewer quick-look" 
        camera-controls 
        shadow-intensity="1" 
        auto-rotate 
        style="width: 100%; height: 100vh;">
        
        <div slot="poster" style="display: flex; justify-content: center; align-items: center; height: 100%;">
            <p>Loading High Quality 3D Model...</p>
        </div>
    </model-viewer>

</body>
</html>
