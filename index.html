<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MiDES 3D Viewer</title>
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
</head>
<body style="margin: 0; background-color: #f5f5f5;">

    <model-viewer 
        src="SOLAR_GLOW-v4.glb" 
        ar 
        ar-modes="webxr scene-viewer quick-look" 
        camera-controls 
        shadow-intensity="1" 
        auto-rotate 
        style="width: 100%; height: 100vh;">
        
        <div style="position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); background: white; padding: 10px 20px; border-radius: 20px; font-family: sans-serif; box-shadow: 0 2px 5px rgba(0,0,0,0.1);">
            Move fingers to zoom in and out
        </div>
    </model-viewer>

</body>
</html>
